
name: ROS 2 CI
on:
  push:
jobs:
  build_and_test_ros2:
    runs-on: ubuntu-22.04 
    container:
      image: rostooling/setup-ros-docker:ubuntu-jammy-latest
    steps:
      - name: Build and run tests
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: microstrain_inertial 
          target-ros2-distro: jazzy
